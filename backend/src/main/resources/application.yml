server:
  port: ${PORT:9090}
  forward-headers-strategy: framework   # real client IP behind a proxy/load balancer (login rate limiting)

spring:
  application:
    name: bookleaf-support
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 52MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bookleaf?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}   # use 'validate' + Flyway in production
    properties:
      hibernate:
        format_sql: false
  jackson:
    default-property-inclusion: non_null
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
  ai:
    openai:
      # Groq exposes an OpenAI-compatible Chat Completions API.
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: ${GROQ_MODEL:qwen/qwen3.8-27b}
          temperature: 0.2
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s

bookleaf:
  attachments:
    directory: ${ATTACHMENT_STORAGE_DIR:./uploads}
  ai:
    enabled: ${AI_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minuetes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  seed:
    enabled: ${SEED_ENABLED:false}
    admin-email: ${SEED_ADMIN_EMAIL:admin@bookleaf.com}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    author-password: ${SEED_AUTHOR_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bookleaf: INFO
